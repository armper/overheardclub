<nav class="topbar">
    <div class="topbar-inner">
        <a class="brand" routerLink="/" (click)="collapseNavbar()">
            <span class="brand-mark" aria-hidden="true"></span>
            <span class="brand-name">Overheard<span class="brand-accent">Club</span></span>
        </a>

        <button class="topbar-toggle" type="button" aria-label="Toggle navigation" [attr.aria-expanded]="!isNavbarCollapsed" (click)="toggleNavbar()">
            <fa-icon [icon]="isNavbarCollapsed ? 'bars' : 'times'"></fa-icon>
        </button>

        <div class="topbar-links" [class.open]="!isNavbarCollapsed" [ngSwitch]="isAuthenticated()">
            <a class="topbar-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="collapseNavbar()">Feed</a>
            <a class="topbar-link" *ngSwitchCase="true" routerLink="/topic" routerLinkActive="active" (click)="collapseNavbar()">Topics</a>

            <div class="topbar-spacer"></div>

            <a class="btn btn-primary btn-sm topbar-cta" *ngSwitchCase="true" routerLink="/post/new" (click)="collapseNavbar()">
                <fa-icon icon="plus"></fa-icon>
                <span>New post</span>
            </a>

            <div *jhiHasAnyAuthority="'ROLE_ADMIN'" ngbDropdown class="topbar-menu" display="dynamic" placement="bottom-right">
                <a class="topbar-link dropdown-toggle" ngbDropdownToggle href="javascript:void(0);" id="admin-menu">Admin</a>
                <ul class="dropdown-menu" ngbDropdownMenu aria-labelledby="admin-menu">
                    <li><a class="dropdown-item" routerLink="admin/user-management" routerLinkActive="active" (click)="collapseNavbar()"><fa-icon icon="user" fixedWidth="true"></fa-icon><span>Users</span></a></li>
                    <li><a class="dropdown-item" routerLink="post" routerLinkActive="active" (click)="collapseNavbar()"><fa-icon icon="th-list" fixedWidth="true"></fa-icon><span>All posts</span></a></li>
                    <li><a class="dropdown-item" routerLink="overheard-comment" routerLinkActive="active" (click)="collapseNavbar()"><fa-icon icon="th-list" fixedWidth="true"></fa-icon><span>All comments</span></a></li>
                    <li class="dropdown-divider"></li>
                    <li><a class="dropdown-item" routerLink="admin/metrics" routerLinkActive="active" (click)="collapseNavbar()"><fa-icon icon="tachometer-alt" fixedWidth="true"></fa-icon><span>Metrics</span></a></li>
                    <li><a class="dropdown-item" routerLink="admin/health" routerLinkActive="active" (click)="collapseNavbar()"><fa-icon icon="heart" fixedWidth="true"></fa-icon><span>Health</span></a></li>
                    <li><a class="dropdown-item" routerLink="admin/configuration" routerLinkActive="active" (click)="collapseNavbar()"><fa-icon icon="list" fixedWidth="true"></fa-icon><span>Configuration</span></a></li>
                    <li><a class="dropdown-item" routerLink="admin/audits" routerLinkActive="active" (click)="collapseNavbar()"><fa-icon icon="bell" fixedWidth="true"></fa-icon><span>Audits</span></a></li>
                    <li><a class="dropdown-item" routerLink="admin/logs" routerLinkActive="active" (click)="collapseNavbar()"><fa-icon icon="tasks" fixedWidth="true"></fa-icon><span>Logs</span></a></li>
                    <li *ngIf="swaggerEnabled"><a class="dropdown-item" routerLink="admin/docs" routerLinkActive="active" (click)="collapseNavbar()"><fa-icon icon="book" fixedWidth="true"></fa-icon><span>API</span></a></li>
                    <li *ngIf="!inProduction"><a class="dropdown-item" href="./h2-console" target="_tab" (click)="collapseNavbar()"><fa-icon icon="hdd" fixedWidth="true"></fa-icon><span>Database</span></a></li>
                </ul>
            </div>

            <div *ngSwitchCase="true" ngbDropdown class="topbar-menu" display="dynamic" placement="bottom-right">
                <a class="topbar-avatar" ngbDropdownToggle href="javascript:void(0);" id="account-menu" [attr.aria-label]="'Account menu'">
                    <img *ngIf="getImageUrl()" [src]="getImageUrl()" class="avatar avatar-img" alt="Avatar">
                    <span *ngIf="!getImageUrl()" class="avatar">{{ initial() }}</span>
                </a>
                <ul class="dropdown-menu" ngbDropdownMenu aria-labelledby="account-menu">
                    <li class="dropdown-header">{{ displayName() }}</li>
                    <li><a class="dropdown-item" routerLink="account/settings" routerLinkActive="active" (click)="collapseNavbar()"><fa-icon icon="wrench" fixedWidth="true"></fa-icon><span>Settings</span></a></li>
                    <li><a class="dropdown-item" routerLink="account/password" routerLinkActive="active" (click)="collapseNavbar()"><fa-icon icon="lock" fixedWidth="true"></fa-icon><span>Password</span></a></li>
                    <li class="dropdown-divider"></li>
                    <li><a class="dropdown-item" (click)="logout()" id="logout"><fa-icon icon="sign-out-alt" fixedWidth="true"></fa-icon><span>Sign out</span></a></li>
                </ul>
            </div>

            <ng-container *ngSwitchCase="false">
                <a class="topbar-link" id="login" (click)="login()">Sign in</a>
                <a class="btn btn-primary btn-sm topbar-cta" routerLink="account/register" (click)="collapseNavbar()">Join</a>
            </ng-container>
        </div>
    </div>
</nav>
