<article class="post-card" *ngIf="post">
    <div class="post-meta">
        <span class="author"><span class="avatar">{{ initial() }}</span>{{ authorName() }}</span>
        <span class="dot"></span>
        <span [title]="post.date">{{ post.date | timeAgo }}</span>
        <ng-container *ngIf="post.topic && !hideTopic">
            <span class="dot"></span>
            <a class="topic-chip" [routerLink]="['/topic', post.topic.id, 'view']">{{ post.topic.title }}</a>
        </ng-container>
    </div>

    <h2 class="post-title" *ngIf="!full"><a [routerLink]="['/post', post.id, 'view']">{{ post.title }}</a></h2>
    <h1 class="post-title" *ngIf="full">{{ post.title }}</h1>

    <p class="post-excerpt" *ngIf="!full && post.content">{{ excerpt() }}</p>
    <div class="post-quote" *ngIf="full && post.content">{{ post.content }}</div>

    <div class="reactions" [attr.aria-label]="'Reactions'">
        <button type="button" class="reaction" *ngFor="let r of reactions"
                [disabled]="busy || hasReacted()"
                [title]="hasReacted() ? 'You already reacted to this' : r.label"
                (click)="react(r.key)">
            <span class="emoji">{{ r.emoji }}</span>
            <span class="count" *ngIf="count(r.key) > 0">{{ count(r.key) }}</span>
        </button>
    </div>

    <div class="post-actions" *ngIf="!full">
        <a [routerLink]="['/post', post.id, 'view']">
            <ng-container *ngIf="commentCount !== undefined; else openLabel">{{ commentCount }} {{ commentCount === 1 ? 'comment' : 'comments' }}</ng-container>
            <ng-template #openLabel>Open</ng-template>
        </a>
        <span *ngIf="hasReacted()" class="muted">· You reacted</span>
    </div>
</article>
