<div class="modal-header">
    <h4 class="modal-title">Welcome back</h4>
    <button aria-label="Close" data-dismiss="modal" class="close" type="button" (click)="activeModal.dismiss('closed')">
        <span aria-hidden="true">&times;</span>
    </button>
</div>

<div class="modal-body">
    <div class="alert alert-danger" *ngIf="authenticationError">
        <strong>That didn't work.</strong> Check your username and password and try again.
    </div>

    <form class="form" role="form" (ngSubmit)="login()" [formGroup]="loginForm">
        <div class="form-group">
            <label class="username-label" for="username">Username</label>
            <input type="text" class="form-control" name="username" id="username" placeholder="Your username" formControlName="username" autocomplete="username" #username>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" class="form-control" name="password" id="password" placeholder="Your password" formControlName="password" autocomplete="current-password">
        </div>

        <div class="d-flex align-items-center justify-content-between mb-3">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="rememberMe" id="rememberMe" formControlName="rememberMe">
                <label class="form-check-label" for="rememberMe">Remember me</label>
            </div>
            <a class="small-muted" (click)="requestResetPassword()">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Sign in</button>
    </form>

    <p class="small-muted text-center mt-4 mb-0">
        New here? <a (click)="register()">Create an account</a>
    </p>
</div>
