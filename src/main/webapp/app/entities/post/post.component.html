<div>
    <div class="page-header">
        <div>
            <span class="eyebrow">Admin</span>
            <h1 id="page-heading">All posts</h1>
        </div>
        <button id="jh-create-entity" class="btn btn-primary btn-sm jh-create-entity create-post" [routerLink]="['/post/new']">
            <fa-icon icon="plus"></fa-icon><span>New post</span>
        </button>
    </div>

    <jhi-alert-error></jhi-alert-error>
    <jhi-alert></jhi-alert>

    <div class="empty" id="no-result" *ngIf="posts?.length === 0">
        <p>No posts found.</p>
    </div>

    <div class="table-responsive" id="entities" *ngIf="posts?.length > 0">
        <table class="table" aria-describedby="page-heading">
            <thead>
                <tr jhiSort [(predicate)]="predicate" [(ascending)]="ascending" [callback]="reset.bind(this)">
                    <th scope="col" jhiSortBy="id"><span>ID</span> <fa-icon icon="sort"></fa-icon></th>
                    <th scope="col" jhiSortBy="title"><span>Title</span> <fa-icon icon="sort"></fa-icon></th>
                    <th scope="col" jhiSortBy="date"><span>Date</span> <fa-icon icon="sort"></fa-icon></th>
                    <th scope="col" jhiSortBy="rankOne"><span>👍</span> <fa-icon icon="sort"></fa-icon></th>
                    <th scope="col" jhiSortBy="rankTwo"><span>❤️</span> <fa-icon icon="sort"></fa-icon></th>
                    <th scope="col" jhiSortBy="rankThree"><span>😂</span> <fa-icon icon="sort"></fa-icon></th>
                    <th scope="col" jhiSortBy="rankFour"><span>🤯</span> <fa-icon icon="sort"></fa-icon></th>
                    <th scope="col" jhiSortBy="rankFive"><span>🙄</span> <fa-icon icon="sort"></fa-icon></th>
                    <th scope="col" jhiSortBy="user.login"><span>Author</span> <fa-icon icon="sort"></fa-icon></th>
                    <th scope="col" jhiSortBy="topic.title"><span>Topic</span> <fa-icon icon="sort"></fa-icon></th>
                    <th scope="col"></th>
                </tr>
            </thead>
            <tbody infinite-scroll (scrolled)="loadPage(page + 1)" [infiniteScrollDisabled]="page >= links['last']" [infiniteScrollDistance]="0">
                <tr *ngFor="let post of posts ;trackBy: trackId">
                    <td><a [routerLink]="['/post', post.id, 'view']">{{ post.id }}</a></td>
                    <td><a [routerLink]="['/post', post.id, 'view']">{{ post.title }}</a></td>
                    <td class="text-nowrap">{{ post.date | date:'medium' }}</td>
                    <td>{{ post.rankOne }}</td>
                    <td>{{ post.rankTwo }}</td>
                    <td>{{ post.rankThree }}</td>
                    <td>{{ post.rankFour }}</td>
                    <td>{{ post.rankFive }}</td>
                    <td>{{ post.user?.login }}</td>
                    <td><a *ngIf="post.topic" [routerLink]="['/topic', post.topic?.id, 'view']">{{ post.topic?.title }}</a></td>
                    <td class="text-right text-nowrap">
                        <div class="btn-group">
                            <button type="submit" [routerLink]="['/post', post.id, 'edit']" class="btn btn-secondary btn-sm">
                                <fa-icon icon="pencil-alt"></fa-icon>
                                <span class="d-none d-md-inline">Edit</span>
                            </button>
                            <button type="submit" (click)="delete(post)" class="btn btn-danger btn-sm">
                                <fa-icon icon="times"></fa-icon>
                                <span class="d-none d-md-inline">Delete</span>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
