<form *ngIf="post" name="deleteForm" (ngSubmit)="confirmDelete(post.id!)">
    <div class="modal-header">
        <h4 class="modal-title">Delete this post?</h4>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close" (click)="cancel()">&times;</button>
    </div>

    <div class="modal-body">
        <jhi-alert-error></jhi-alert-error>
        <p id="jhi-delete-post-heading" class="mb-0 muted">“{{ post.title }}” and its comments will be removed. This can't be undone.</p>
    </div>

    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal" (click)="cancel()">Cancel</button>
        <button id="jhi-confirm-delete-post" type="submit" class="btn btn-danger">Delete</button>
    </div>
</form>
