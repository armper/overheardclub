<div>
    <h2 id="page-heading" class="d-flex flex-wrap align-items-center">
        <span class="mr-auto"><fa-icon icon="tags"></fa-icon> Topics</span>

        <button *ngIf="account" id="jh-create-entity" class="btn btn-primary jh-create-entity create-topic" [routerLink]="['/topic/new']">
            <fa-icon icon="plus"></fa-icon>
            <span>Start a new topic</span>
        </button>
    </h2>

    <jhi-alert-error></jhi-alert-error>

    <jhi-alert></jhi-alert>

    <div class="form-group mt-3" *ngIf="topics && topics.length > 0">
        <input type="search" class="form-control" [(ngModel)]="filter" placeholder="Filter topics..." aria-label="Filter topics" />
    </div>

    <div class="alert alert-warning" id="no-result" *ngIf="topics?.length === 0">
        <span>No topics found</span>
    </div>

    <div class="list-group" id="entities" *ngIf="topics && topics.length > 0">
        <div *ngFor="let topic of filteredTopics; trackBy: trackId" class="list-group-item d-flex align-items-center">
            <a class="mr-auto" [routerLink]="['/topic', topic.id, 'view']">#{{ topic.title }}</a>
            <div class="btn-group" *ngIf="canModify(topic)">
                <button type="button" [routerLink]="['/topic', topic.id, 'edit']" class="btn btn-outline-primary btn-sm">
                    <fa-icon icon="pencil-alt"></fa-icon>
                    <span class="d-none d-md-inline">Edit</span>
                </button>
                <button type="button" (click)="delete(topic)" class="btn btn-outline-danger btn-sm">
                    <fa-icon icon="times"></fa-icon>
                    <span class="d-none d-md-inline">Delete</span>
                </button>
            </div>
        </div>
        <div *ngIf="filteredTopics.length === 0" class="list-group-item text-muted">No topics match "{{ filter }}".</div>
    </div>
</div>
