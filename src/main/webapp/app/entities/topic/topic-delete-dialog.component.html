<form *ngIf="topic" name="deleteForm" (ngSubmit)="confirmDelete(topic.id!)">
    <div class="modal-header">
        <h4 class="modal-title">Delete this topic?</h4>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close" (click)="cancel()">&times;</button>
    </div>
    <div class="modal-body">
        <jhi-alert-error></jhi-alert-error>
        <p id="jhi-delete-topic-heading" class="mb-0 muted">“{{ topic.title }}” will be removed. Topics that still have posts can't be deleted.</p>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal" (click)="cancel()">Cancel</button>
        <button id="jhi-confirm-delete-topic" type="submit" class="btn btn-danger">Delete</button>
    </div>
</form>
