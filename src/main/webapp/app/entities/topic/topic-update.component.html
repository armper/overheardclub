<form name="editForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="editForm">
    <div class="page-header">
        <div>
            <span class="eyebrow">{{ editForm.get('id')!.value ? 'Edit topic' : 'New topic' }}</span>
            <h1 id="jhi-topic-heading">{{ editForm.get('id')!.value ? 'Rename topic' : 'Create a topic' }}</h1>
        </div>
    </div>

    <jhi-alert-error></jhi-alert-error>

    <div class="form-group">
        <label class="form-control-label" for="field_title">Name</label>
        <input type="text" class="form-control" name="title" id="field_title" formControlName="title" placeholder="e.g. At the office" maxlength="80" autocomplete="off" />
        <div *ngIf="editForm.get('title')!.invalid && (editForm.get('title')!.dirty || editForm.get('title')!.touched)">
            <small class="form-text text-danger" *ngIf="editForm.get('title')?.errors?.required">A name is required.</small>
            <small class="form-text text-danger" *ngIf="editForm.get('title')?.errors?.minlength">At least 2 characters.</small>
            <small class="form-text text-danger" *ngIf="editForm.get('title')?.errors?.maxlength">At most 80 characters.</small>
        </div>
    </div>

    <div class="form-group" *ngIf="isAdmin()">
        <label class="form-control-label" for="field_user">Owner</label>
        <select class="form-control" id="field_user" name="user" formControlName="user">
            <option *ngIf="!editForm.get('user')!.value" [ngValue]="null" selected></option>
            <option [ngValue]="userOption.id === editForm.get('user')!.value?.id ? editForm.get('user')!.value : userOption" *ngFor="let userOption of users; trackBy: trackById">{{ userOption.login }}</option>
        </select>
    </div>

    <div class="form-actions">
        <button type="button" id="cancel-save" class="btn btn-secondary" (click)="previousState()">Cancel</button>
        <button type="submit" id="save-entity" [disabled]="editForm.invalid || isSaving" class="btn btn-primary">{{ isSaving ? 'Saving…' : 'Save' }}</button>
    </div>
</form>
