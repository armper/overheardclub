<div class="row justify-content-center">
    <div class="col-lg-8">
        <div *ngIf="topic">
            <button type="button" (click)="previousState()" class="btn btn-link pl-0">
                <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span>Back</span>
            </button>

            <div class="d-flex flex-wrap align-items-center mb-3">
                <h2 class="mr-auto mb-0">#{{ topic.title }}</h2>
                <button *ngIf="canModify()" type="button" [routerLink]="['/topic', topic.id, 'edit']"
                        class="btn btn-sm btn-outline-primary mr-2">
                    <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span>Edit topic</span>
                </button>
                <button id="jh-create-entity" class="btn btn-primary jh-create-entity create-post"
                        [routerLink]="['/post/new']" [queryParams]="{ topicId: topic.id }">
                    <fa-icon icon="plus"></fa-icon>
                    <span>Post in this topic</span>
                </button>
            </div>

            <jhi-alert-error></jhi-alert-error>

            <ul class="nav nav-pills mb-3">
                <li class="nav-item">
                    <a class="nav-link" href="javascript:void(0)" [class.active]="sort === 'new'" (click)="setSort('new')">
                        <fa-icon icon="clock"></fa-icon> Newest
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="javascript:void(0)" [class.active]="sort === 'top'" (click)="setSort('top')">
                        <fa-icon icon="fire"></fa-icon> Funniest
                    </a>
                </li>
            </ul>

            <jhi-post-card *ngFor="let post of posts; trackBy: trackId" [post]="post" [account]="account" [showTopic]="false"></jhi-post-card>

            <div *ngIf="!loading && posts.length === 0" class="alert alert-warning">
                Nothing overheard in this topic yet. Be the first to post!
            </div>

            <div class="text-center my-3">
                <span *ngIf="loading" class="text-muted">Loading…</span>
                <button *ngIf="!loading && hasMore" type="button" class="btn btn-outline-primary" (click)="loadMore()">Load more</button>
            </div>
        </div>
    </div>
</div>
