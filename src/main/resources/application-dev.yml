spring:
  datasource:
    url: jdbc:h2:file:./data/overheard;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  seed:
    enabled: true
    admin-password: ${APP_SEED_ADMIN_PASSWORD:admin}

logging:
  level:
    club.overheard: DEBUG
