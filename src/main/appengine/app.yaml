# Google App Engine standard (Java 21).
# Deploy with: ./mvnw -Pprod package && gcloud app deploy target/overheardclub-1.0.0.jar --appyaml=src/main/appengine/app.yaml
runtime: java21
instance_class: F2
service: default
entrypoint: java -jar overheardclub-1.0.0.jar
env_variables:
  SPRING_PROFILES_ACTIVE: prod
  # Set these in the Cloud console or a secret manager; do not commit real values.
  # DATABASE_URL: jdbc:postgresql:///overheardclub?cloudSqlInstance=PROJECT:REGION:INSTANCE&socketFactory=com.google.cloud.sql.postgres.SocketFactory
  # DATABASE_USER: ...
  # DATABASE_PASSWORD: ...
  # APP_JWT_SECRET: ...
  # APP_SEED_ADMIN_PASSWORD: ...
handlers:
  - url: /.*
    script: auto
    secure: always
automatic_scaling:
  min_instances: 0
  max_instances: 2
