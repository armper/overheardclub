<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Overheard Club moose">
  <defs>
    <clipPath id="badge"><circle cx="100" cy="100" r="96"/></clipPath>
  </defs>
  <!-- badge -->
  <circle cx="100" cy="100" r="96" fill="#2457d6"/>
  <circle cx="100" cy="100" r="96" fill="none" stroke="#ffd23f" stroke-width="7"/>
  <g clip-path="url(#badge)">
    <!-- antlers -->
    <g fill="#ffd23f" stroke="#c99a12" stroke-width="3" stroke-linejoin="round">
      <path d="M62 78 C40 74 30 58 30 40 C30 32 38 30 42 36 C44 26 54 26 56 34 C60 24 72 26 70 38 C78 32 90 40 84 52 C90 60 84 76 62 78 Z"/>
      <path d="M138 78 C160 74 170 58 170 40 C170 32 162 30 158 36 C156 26 146 26 144 34 C140 24 128 26 130 38 C122 32 110 40 116 52 C110 60 116 76 138 78 Z"/>
    </g>
    <!-- ears -->
    <ellipse cx="46" cy="94" rx="14" ry="9" fill="#8c5a2b" stroke="#5a3616" stroke-width="3" transform="rotate(-20 46 94)"/>
    <ellipse cx="154" cy="94" rx="14" ry="9" fill="#8c5a2b" stroke="#5a3616" stroke-width="3" transform="rotate(20 154 94)"/>
    <!-- head -->
    <path d="M62 86 C60 66 140 66 138 86 C146 108 140 128 122 140 L78 140 C60 128 54 108 62 86 Z" fill="#a06a35" stroke="#5a3616" stroke-width="3"/>
    <!-- muzzle -->
    <path d="M66 126 C60 158 140 158 134 126 C130 110 70 110 66 126 Z" fill="#d9a066" stroke="#5a3616" stroke-width="3"/>
    <!-- nose -->
    <ellipse cx="100" cy="140" rx="17" ry="11" fill="#3b2416"/>
    <ellipse cx="94" cy="136" rx="4" ry="2.5" fill="#6b4a33"/>
    <!-- smile -->
    <path d="M86 152 Q100 160 114 152" fill="none" stroke="#5a3616" stroke-width="3" stroke-linecap="round"/>
    <!-- eyes -->
    <circle cx="82" cy="104" r="9" fill="#fff"/>
    <circle cx="118" cy="104" r="9" fill="#fff"/>
    <circle cx="84" cy="106" r="5" fill="#1a1a1a"/>
    <circle cx="120" cy="106" r="5" fill="#1a1a1a"/>
    <circle cx="86" cy="104" r="1.8" fill="#fff"/>
    <circle cx="122" cy="104" r="1.8" fill="#fff"/>
    <!-- cheeks -->
    <circle cx="70" cy="118" r="6" fill="#ffd23f" opacity="0.8"/>
    <circle cx="130" cy="118" r="6" fill="#ffd23f" opacity="0.8"/>
  </g>
</svg>
